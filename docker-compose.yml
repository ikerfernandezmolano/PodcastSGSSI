services:
  web:
    image: web
    container_name: web_app
    environment:
      - ALLOW_OVERRIDE=true
    ports:
      - "81:443"
    links:
      - db
    volumes:
      - ./app:/var/www/html/
      - ./mysqlcerts/ca-cert.pem:/etc/ssl/certs/ca-cert.pem
      - ./ssl/server.crt:/etc/ssl/certs/server.crt
      - ./ssl/server.key:/etc/ssl/private/server.key
      - ./app/apache/default-ssl.conf:/etc/apache2/sites-available/default-ssl.conf
    command: >
      bash -c "a2enmod ssl &&
               a2enmod rewrite &&
               a2enmod headers &&
               a2ensite default-ssl &&
               apache2-foreground"
    depends_on:
      - db

  db:
    image: mariadb:10.8.2
    container_name: db_app
    restart: always
    volumes:
      - ./mysql:/var/lib/mysql
      - ./mysqlcerts:/etc/mysql/certs
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin
      MYSQL_PASSWORD: test
      MYSQL_DATABASE: database
    command: >
      --ssl-ca=/etc/mysql/certs/ca-cert.pem
      --ssl-cert=/etc/mysql/certs/server-cert.pem
      --ssl-key=/etc/mysql/certs/server-key.pem
    ports:
      - "8889:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin_app
    links:
      - db
    ports:
      - "8890:80"
    environment:
      MYSQL_USER: admin
      MYSQL_PASSWORD: test
      MYSQL_DATABASE: database

